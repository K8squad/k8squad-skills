apiVersion: ksquad.io/v1alpha1
kind: Toolchain
metadata:
  name: postgres-client
  # namespace: <team-namespace>  set via: kubectl apply -k toolchains/ -n <team-namespace>
  labels:
    ksquad.io/catalog: long-tail
spec:
  versions:
  - version: "16"
    image: ghcr.io/k8squad/toolchains/postgres-client:16
    provides: [psql, pg_dump]
