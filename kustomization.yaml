# Apply the whole catalog into one namespace:
#   kubectl apply -k .
# Override `namespace:` below to target your own squad's namespace.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bmad-squad
resources:
- skills/bmad/skill.yaml
- skills/github/skill.yaml
- skills/dynatrace/skill.yaml
- skills/dt-dql-essentials/skill.yaml
- skills/graphical/skill.yaml
- skills/code-search/skill.yaml
- skills/kubectl-debug/skill.yaml
- skills/go-build-test/skill.yaml
- skills/git-workflow/skill.yaml
- skills/golangci-lint/skill.yaml
- skills/otel-observability-query/skill.yaml
- skills/container-build/skill.yaml
- skills/delve-pprof/skill.yaml
- skills/psql-inspect/skill.yaml
- skills/http-grpc-probe/skill.yaml
# Social category (ISI-5774). social-repurpose is text-only and ships now.
- skills/social-repurpose/skill.yaml
# linkedin-publish / x-publish / social-stats are authored but intentionally
# NOT listed here: their mcpToolRefs ([linkedin]/[x]) are dangling until the
# board provisions the LinkedIn + X API MCPServers and credential Secrets, and a
# dangling ref rejects the Skill at admission. Wire them in (WS-8) once the
# go-live gate clears (ISI-5774 §7 decision #3; unblock owner = BOARD/Henrik).
# Design category (ISI-5770). dataviz + slides-deck carry no credential and
# ship now. slides-deck requires the marp@4 + pandoc@3 long-tail toolchains
# (ISI-5768) — apply them per-namespace with `kubectl apply -k toolchains/`.
- skills/dataviz/skill.yaml
- skills/slides-deck/skill.yaml
# image-gen / video-gen / audio-music are authored but intentionally NOT listed
# here: their mcpToolRefs ([gemini-image]/[fal]/[heygen]/[elevenlabs]) are
# dangling until the board provisions the Gemini / fal.ai / HeyGen / ElevenLabs
# MCPServers and credential Secrets, and a dangling ref rejects the Skill at
# admission. Wire them in (WS-8) once the go-live gate clears (ISI-5754 §7;
# unblock owner = BOARD/Henrik).
