apiVersion: ksquad.io/v1alpha1
kind: Skill
metadata:
  name: github
  namespace: bmad-squad
spec:
  source:
    type: git
    git:
      repoRef: github.com/K8squad/k8squad-skills
      ref: bf3bc86b338d488fe751c289943db194ce8102c7
      path: skills/github
  mcpToolRefs:
  - name: github-mcp
  permissions:
  - scm:read
  - scm:write
  - pr:write
  - issue:write
  requires:
    toolchains:
    - gh@2.62
